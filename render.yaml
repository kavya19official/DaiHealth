services:
  - type: web
    name: dai-healthathon-demo
    runtime: docker
    plan: standard
    numInstances: 1
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: dai-demo-state
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DAI_DEMO_PASSWORD
        generateValue: true
      - key: DAI_DEMO_ACCESS_KEY
        generateValue: true
      - key: DAI_PUBLIC_ORIGIN
        sync: false
      - key: DAI_SEED_NIVARA_DEMO
        value: "true"
      - key: ML_ENABLED
        value: "true"
      - key: PATIENT_ML_RANKING_ENABLED
        value: "true"
      - key: PENDING_CARE_ASSISTANT
        value: "true"
      - key: PENDING_CARE_PLANNER
        value: "true"
      - key: DAI_ULTRASOUND_ENABLED
        value: "true"
      - key: DAI_ULTRASOUND_IMAGE_KEY
        sync: false
      - key: DAI_RECORD_CONNECTIONS_KEY
        sync: false
      - key: DAI_ULTRASOUND_GATEWAY_TOKEN
        generateValue: true
      - key: DAI_ULTRASOUND_SERVICE_TOKEN
        generateValue: true
