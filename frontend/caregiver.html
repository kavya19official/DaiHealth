<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DAI · Family access</title><link rel="stylesheet" href="connected-care.css"><style>body{font:16px/1.6 system-ui;background:#f8f5ff;color:#1e1b4b;max-width:900px;margin:30px auto;padding:18px}.btn,button{padding:12px;border:1px solid #ddd;border-radius:10px;background:#f3e8ff;font:inherit}input{padding:12px;max-width:100%}label{display:block;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>DAI · Family access</h1><p>Only records explicitly shared with this account appear here. Access is read-only and revocable by the mother.</p><section class="connected-care-card" id="signIn"><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><button type="button" id="create">Create invited caregiver account</button></form></section><p id="status" role="status" aria-live="polite"></p><div class="connected-care-actions"><button id="accept">Accept private invitation</button><button id="refresh">Refresh shared records</button><button id="logout">Sign out</button></div><main id="shared"></main><script src="js/caregiver.js"></script></body></html>
